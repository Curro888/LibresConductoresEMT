firebase.initializeApp({
  apiKey:"AIzaSyCy-Bple2Z3pEFz5jRd1m_f6l0mXIHzWbM",

const db=firebase.database();

// ===== UTILIDADES =====
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DSEM=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const SUBS=['A','B','C','D','E','F','G','H','I','J'];
const SUB_RSN=['1','2','3','4','5','6','7','8','9','A','B','C','D','E','F','G','H','I','J','K'];
const SISTEMAS=[{id:'C',nombre:'Línea convencional',grupos:['1','2','3','4','5']},{id:'B',nombre:'Búhos',grupos:['B1','B2','B3','B4','B5']},{id:'R',nombre:'R.S.N',grupos:['RA','RB']}];
const ANIOS=Object.keys(POR_ANIO).map(Number).sort();
const VACIO={libres:Array(12).fill([]),subgrupo:Array(12).fill([]),lrj:Array(12).fill([])};

function sistemaDe(g){g=String(g||'');return g[0]==='R'?'R':g[0]==='B'?'B':'C'}
function subgruposDe(g){return sistemaDe(g)==='R'?SUB_RSN:SUBS}
function nombreGrupo(g){g=String(g||'');const s=sistemaDe(g);return s==='B'?'Búhos '+g.slice(1):s==='R'?'R.S.N '+g.slice(1):'Grupo '+g}
function nombreGrupoSub(g,t){g=String(g||'');return sistemaDe(g)==='R'?'R.S.N '+g.slice(1)+(t||''):nombreGrupo(g)+(t?' · '+t:'')}
function etiquetaGrupo(g,t){g=String(g||'');const s=sistemaDe(g);return s==='B'?'Bú'+g.slice(1)+'·'+t:s==='R'?'RSN '+g.slice(1)+t:'G'+g+'·'+t}
function textoPerfil(m){if(!m)return'';const p=[etiquetaGrupo(m.g,m.t)];if(m.c)p.push('Correturnos');else{if(m.l)p.push('Línea '+m.l);if(m.tu)p.push('Turno '+m.tu)}if(m.e)p.push('Esc. '+m.e);return p.join(' · ')}
function getLibres(y,g,t){const po=POR_ANIO[y];if(!po)return VACIO;const s=sistemaDe(g);const tb=po[s];if(!tb)return VACIO;t=String(t||'').toUpperCase();return tb[(s==='C'?String(g):String(g).slice(1))+t]||VACIO}
function anioInicial(){const h=new Date().getFullYear();if(ANIOS.includes(h))return h;const f=ANIOS.filter(a=>a>h);return f.length?Math.min(...f):Math.max(...ANIOS)}
function esFestivo(y,m,d){const f=FESTIVOS[y]||[];const k=d+'/'+(m+1);return f.find(x=>x.fecha===k)||null}
function claveDia(y,m,d){return y+'_'+m+'_'+d}
function leerDia(o,y,m,d){if(!o)return undefined;const v=o[claveDia(y,m,d)];if(v!==undefined)return v;if(y===2026)return o[m+'_'+d];return undefined}
function claveActual(o,y,m,d){const n=claveDia(y,m,d);if(o&&o[n]!==undefined)return n;if(y===2026&&o&&o[m+'_'+d]!==undefined)return m+'_'+d;return n}
function libreBase(y,g,t,m,d){const L=getLibres(y,g,t);return (L.libres[m]||[]).includes(d)||(L.subgrupo[m]||[]).includes(d)||(L.lrj[m]||[]).includes(d)}
function esLibreFinal(y,g,t,m,d,cambios){let l=libreBase(y,g,t,m,d);const c=leerDia(cambios,y,m,d);if(c){if(c.clase==='b-cambio-libre'||c.clase==='b-vac')l=true;else if(['b-inter','b-pend','b-generado','b-l26'].includes(c.clase))l=false}return l}

// ===== ESTADO =====
let S=null;
let tab='cal', anio=anioInicial();
let cambios={}, cambiosTodos={}, miembros=[], offs=[];
let grVer={s:null,g:null,t:null};
let hbTimer=null;
let SEL=null,PEND=null,vistas=new Set(),vigPend=null;
let hist={},notas={},HV=null;

function guardarSesion(){LS.set('sesionLC',S)}
function modal(html){$('modalc').innerHTML=html;$('modal').classList.remove('hide')}
function cerrarModal(){$('modal').classList.add('hide');$('modalc').innerHTML=''}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')cerrarModal()});
function misDatos(){return {g:S.miGrupoSesion,t:S.miTipoSesion}}

// ===== MES (HTML) =====
function mesHTML(y,m,g,t,cam,opt){
  opt=opt||{};const L=getLibres(y,g,t);const hoy=new Date();
  const start=(new Date(y,m,1).getDay()+6)%7, n=new Date(y,m+1,0).getDate();
  let h='<div class="mes"><h3>'+MESES[m]+'</h3><div class="grid">'+['L','M','X','J','V','S','D'].map(x=>'<div class="dl">'+x+'</div>').join('');
  for(let i=0;i<start;i++)h+='<div></div>';
  for(let d=1;d<=n;d++){
    const sub=(L.subgrupo[m]||[]).includes(d), lrj=(L.lrj[m]||[]).includes(d), lib=(L.libres[m]||[]).includes(d)||sub||lrj;
    const c=leerDia(cam,y,m,d); let real=lib;
    if(c){if(c.clase==='b-cambio-libre'||c.clase==='b-vac')real=true;else if(['b-inter','b-pend','b-generado','b-l26'].includes(c.clase))real=false}
    let cl='c '+(real?'libre':'trab');
    if(lib&&real){if(lrj)cl='c lrj';else if(sub)cl='c sub'}
    if(esFestivo(y,m,d))cl+=' fest'+(real?' libre':'');
    if(c){cl+=' '+({'b-vac':'vac','b-inter':'inter','b-cambio-libre':'cl','b-pend':'pend','b-generado':'gen','b-l26':'l26'}[c.clase]||'')}
    if(hoy.getFullYear()===y&&hoy.getMonth()===m&&hoy.getDate()===d)cl+=' hoy';
    if(opt.click&&notas&&leerDia(notas,y,m,d))cl+=' nota';
    h+='<div class="'+cl+'"'+(opt.click?' data-d="'+d+'" data-m="'+m+'"':'')+'>'+d+'</div>';
  }
  return h+'</div></div>';
}
const LEYENDA='<div class="leyenda"><span><i style="background:var(--libre)"></i>Libre</span><span><i style="background:var(--sub)"></i>Libre subgrupo</span><span><i style="background:var(--lrj)"></i>Red. jornada</span><span><i style="background:#ef4444"></i>Festivo</span><span><i style="background:#dcfce7;border:1px solid #16a34a"></i>Vacaciones</span><span><i style="background:#fef08a;border:1px solid #eab308"></i>Trabajado</span></div>';
function selectorAnio(){return '<div class="anio"><button data-anio="-1">‹</button><b>'+anio+'</b><button data-anio="1">›</button></div>'}
function avisoSinDatos(g,t){return getLibres(anio,g,t)===VACIO?'<div class="card small">Todavía no hay libres de '+anio+' para este grupo. Se añadirán cuando se publiquen.</div>':''}

// ===== LOGIN =====
let LF={modo:null,P:null,sis:'C'};
const CT_COD='CT';
function esCT(){return !!(S&&S.modoGrupo&&S.grupoActual===CT_COD)}
function pantallaLogin(){
  $('nav').classList.add('hide');$('hsub').textContent='¿Cómo quieres entrar?';
  const gs=LS.get('gruposGuardadosLC')||[];
  let h='';
  if(!LF.modo){
    if(gs.length){h+='<div class="sec">Acceso rápido</div>'+gs.map((g,i)=>'<div style="display:flex;gap:6px;align-items:center"><button class="tile" style="background:#0f766e;min-height:70px" data-ent="'+i+'"><b>👥 '+esc(g.nombre||g.codigo)+'</b><small>'+esc(g.codigo)+' · '+esc(g.perfil?textoPerfil(g.perfil):'')+'</small></button><button style="border:0;background:none;font-size:20px;margin-bottom:10px" data-del="'+i+'">🗑️</button></div>').join('')}
    h+='<div class="sec">Empezar</div>';
    h+='<button class="tile" style="background:#2563eb" data-modo="ind"><div class="circ">👤</div><div><b>Individual</b><small>Solo para mí</small></div></button>';
    h+='<button class="tile" style="background:#16a34a" data-modo="unir"><div class="circ">👥</div><div><b>Unirme a un grupo</b><small>Con el código y la contraseña</small></div></button>';
    h+='<button class="tile" style="background:#7c3aed" data-modo="ct"><div class="circ">🔁</div><div><b>Correturnos</b><small>Todos los correturnos, por escalafón</small></div></button>';
    h+='<button class="tile" style="background:#be185d" data-modo="crear"><div class="circ">➕</div><div><b>Crear un grupo nuevo</b><small>Para tus compañeros</small></div></button>';
    h+='<div class="card small" style="margin-top:14px">📲 En el iPhone: pulsa el botón Compartir de Safari y elige <b>«Añadir a pantalla de inicio»</b> para usarla como una app.</div>';
  }else{
    const t={ind:'Individual',unir:'Unirme a un grupo',crear:'Crear un grupo',ct:'Correturnos'}[LF.modo];
    h+='<div class="card"><button class="btn" style="margin:0 0 6px" data-modo="">‹ Volver</button><h2 style="margin:8px 0">'+t+'</h2>';
    if(LF.modo==='unir')h+='<label>Código del grupo</label><input type="text" id="lf-cod" autocapitalize="off"><label>Contraseña del grupo</label><input type="password" id="lf-pass">';
    if(LF.modo==='crear')h+='<label>Nombre del grupo</label><input type="text" id="lf-gn"><label>Contraseña</label><input type="password" id="lf-pass"><label>Repite la contraseña</label><input type="password" id="lf-pass2">';
    h+='<label>Tu nombre</label><input type="text" id="lf-nom"><label>Tu número de empleado</label><input type="tel" id="lf-id">';
    h+='<div id="pf"></div><button class="btn fill" data-ok="1">'+(LF.modo==='ind'?'Entrar':LF.modo==='unir'?'Unirme':LF.modo==='ct'?'Entrar en Correturnos':'Crear grupo')+'</button></div>';
  }
  $('main').innerHTML=h;
  if(LF.modo)pintaForm($('pf'),LF);
}
function pintaForm(cont,F){
  const P=F.P,sis=P.g?sistemaDe(P.g):F.sis,sd=SISTEMAS.find(x=>x.id===sis),rsn=sis==='R';
  const tg=g=>sis==='C'?g:g.slice(1);
  let h='<label>Tu sistema de libres</label><div class="chips">'+SISTEMAS.map(x=>'<button class="chip'+(sis===x.id?' on':'')+'" data-fs="'+x.id+'">'+x.nombre+'</button>').join('')+'</div>';
  h+='<label>'+(rsn?'Tu grupo R.S.N (primera letra de tu código)':'Tu grupo de libres')+'</label><div class="chips">'+sd.grupos.map(g=>'<button class="chip'+(P.g===g?' on':'')+'" data-fg="'+g+'">'+tg(g)+'</button>').join('')+'</div>';
  h+='<label>'+(rsn?'Resto de tu código (ej. en A1 es el 1; en AB es la B)':'Tu subgrupo')+'</label><div class="chips">'+subgruposDe(P.g||sd.grupos[0]).map(x=>'<button class="chip'+(P.t===x?' on':'')+'" data-ft="'+x+'">'+x+'</button>').join('')+'</div>';
  const ctLogin=F.modo==='ct',ctObl=ctLogin||(F===EF&&esCT()&&P.c);
  if(!ctLogin)h+='<label>¿Tienes línea asignada?</label><div class="chips"><button class="chip'+(!P.c?' on':'')+'" data-fc="0">Sí, línea fija</button><button class="chip'+(P.c?' on':'')+'" data-fc="1">Correturnos</button></div>';
  if(F===EF&&esCT()&&!P.c)h+='<div class="card small">Al guardar con línea fija saldrás de la lista de Correturnos y los que van detrás subirán un puesto.</div>';
  if(!P.c)h+='<label>Línea (opcional)</label><input type="text" id="pf-l" placeholder="Ej: 402 (la E2) o N5 (búho)" autocapitalize="characters" value="'+esc(P.l||'')+'"><label>Turno (opcional)</label><input type="tel" id="pf-tu" placeholder="Ej: 5" value="'+esc(P.tu||'')+'">';
  h+='<label>'+(P.c?'Escalafón en la empresa':'Escalafón en la línea')+(ctObl?' (obligatorio)':' (opcional)')+'</label><input type="tel" id="pf-e" placeholder="Ej: 25 (puedes cambiarlo cuando quieras)" value="'+esc(P.e||'')+'">';
  cont.innerHTML=h;
  const bind=(id,k,f)=>{const el=cont.querySelector('#'+id);if(el)el.addEventListener('input',()=>{el.value=f(el.value);P[k]=el.value})};
  bind('pf-l','l',v=>v.toUpperCase().replace(/[^0-9A-Z]/g,''));bind('pf-tu','tu',v=>v.replace(/\D/g,''));bind('pf-e','e',v=>v.replace(/\D/g,''));
  cont.onclick=e=>{
    const b=e.target.closest('button');if(!b)return;

async function guardarHist(tp){
  const fecha=($('hf').value||'').trim(),nota=($('hn').value||'').trim(),lib=$('hl')?$('hl').value==='1':true;
  if(!/^\d{1,2}\/\d{1,2}(\/\d{4})?$/.test(fecha)){alert('Escribe la fecha así: 15/3/2027');return}
  try{const r=db.ref('historial2/'+S.miID).push();let o;
    if(tp==='l26')o={cat:'l26',subtipo:'manual',ts:Date.now(),fecha:fecha,nota:nota||'L-26',usado:false,esLibre:lib};
    else if(tp==='pendiente')o={cat:'pendiente',subtipo:'manual',ts:Date.now(),fecha:fecha,nota:nota||'Día pendiente',usado:false};
    else{o={cat:'generado',subtipo:tp==='convenio'?'convenio':'manual',ts:Date.now(),fecha:fecha,nota:nota||(tp==='convenio'?'Convenio':'Generado manual'),usado:false};if(tp!=='convenio')o.esLibre=lib}
    await r.set(o);cerrarModal();
  }catch(e){alert('No se pudo guardar: '+(e.code||e.message||e))}
}

const MAX_LIBRES_VAC=8;

  const iso=(yy,mm,dd)=>yy+'-'+String(mm+1).padStart(2,'0')+'-'+String(dd).padStart(2,'0'),st='width:100%;padding:10px;font-size:16px;margin:4px 0 12px;border:1px solid #cbd5e1;border-radius:10px;box-sizing:border-box';

async function chequeoExceso(sim,finTxt){
  const {g,t}=misDatos();let tot=0;
  Object.entries(sim).forEach(([k,c])=>{if(!c||c.clase!=='b-vac')return;const o=partesKey(k);if(o.y!==anio||esFestivo(o.y,o.m,o.d))return;if(libreBase(anio,g,t,o.m,o.d))tot++});
  const exceso=Math.max(0,tot-MAX_LIBRES_VAC);
  const H=(await db.ref('historial2/'+S.miID).once('value')).val()||{};
  const ya=Object.entries(H).filter(([,h])=>h&&h.subtipo==='exceso_vac'&&h.anio===anio);
  if(exceso>ya.length){for(let i=0;i<exceso-ya.length;i++)await db.ref('historial2/'+S.miID).push().set({cat:'generado',subtipo:'exceso_vac',anio:anio,ts:Date.now(),fecha:finTxt||'',nota:'Exceso de libres en vacaciones',usado:false})}
  else if(exceso<ya.length){const nu=ya.filter(([,h])=>!h.usado);for(let i=0;i<Math.min(ya.length-exceso,nu.length);i++)await db.ref('historial2/'+S.miID+'/'+nu[i][0]).remove()}
}
async function confirmarVac(){
  const a=$('vi').value,b=$('vf').value;
  if(!a||!b){alert('Rellena el día de inicio y el de fin.');return}
  const pa=a.split('-').map(Number),pb=b.split('-').map(Number),fi=new Date(pa[0],pa[1]-1,pa[2]),ff=new Date(pb[0],pb[1]-1,pb[2]);
  if(ff<fi){alert('La fecha fin debe ser igual o posterior a la de inicio.');return}
  if((ff-fi)/864e5>120){alert('El periodo es demasiado largo (máximo 120 días).');return}
  try{
    const up={},sim=Object.assign({},cambios),H=hist||{};let n=0;
    for(let f=new Date(fi);f<=ff;f.setDate(f.getDate()+1)){
      const yy=f.getFullYear(),mm=f.getMonth(),dd=f.getDate(),k=claveDia(yy,mm,dd),ex=cambios[claveActual(cambios,yy,mm,dd)];
      if(ex&&ex.linkedUid)continue;
      up['cambios/'+S.miID+'/'+k]={clase:'b-vac',texto:'Vacaciones'};sim[k]={clase:'b-vac'};n++;
      if(esFestivo(yy,mm,dd)){const ft=dd+'/'+(mm+1)+'/'+yy;
        if(!Object.values(H).some(h=>h&&h.subtipo==='festivo_auto'&&h.fecha===ft))
          up['historial2/'+S.miID+'/'+db.ref('historial2/'+S.miID).push().key]={cat:'generado',subtipo:'festivo_auto',ts:Date.now(),fecha:ft,nota:'Festivo trabajado/librado',usado:false}}
    }
    await db.ref().update(up);
    const h0=new Date();h0.setHours(0,0,0,0);
    if(h0>=ff)await chequeoExceso(sim,pb[2]+'/'+pb[1]+'/'+pb[0]);
    cerrarModal();alert('✅ '+n+' días marcados como vacaciones.');
  }catch(e){alert('No se pudo guardar: '+(e.code||e.message||e))}
}
async function borrarVacaciones(key){
  const o=partesKey(key),f0=new Date(o.y,o.m,o.d),keys=[key],isV=(f)=>{const k=claveActual(cambios,f.getFullYear(),f.getMonth(),f.getDate()),c=cambios[k];return c&&c.clase==='b-vac'?k:null};
  let f=new Date(f0),k;
  for(;;){f.setDate(f.getDate()-1);k=isV(f);if(!k)break;keys.push(k)}
  f=new Date(f0);
  for(;;){f.setDate(f.getDate()+1);k=isV(f);if(!k)break;keys.push(k)}
  if(!confirm('¿Borrar todo el periodo de vacaciones ('+keys.length+' días)?'))return;
  try{
    const up={},fechas=keys.map(k=>{const q=partesKey(k);return q.d+'/'+(q.m+1)+'/'+q.y}),sim=Object.assign({},cambios);
    keys.forEach(k=>{up['cambios/'+S.miID+'/'+k]=null;delete sim[k]});
    Object.entries(hist||{}).forEach(([hk,h])=>{if(h&&h.subtipo==='festivo_auto'&&fechas.includes(h.fecha)&&!h.usado)up['historial2/'+S.miID+'/'+hk]=null});
    await db.ref().update(up);await chequeoExceso(sim);cerrarModal();
  }catch(e){alert('No se pudo borrar: '+(e.code||e.message||e))}
}
async function borrarCambioComp(key,prev,hk){
  const other=prev.linkedUid,lk=prev.linkedKey;
  if(!confirm('¿Borrar este cambio con tu compañero? Se quitará de los dos calendarios.'))return;
  try{
    const up={},fd=k=>{const o=partesKey(k);return o.d+'/'+(o.m+1)};
    [S.miID,other].forEach(u=>{up['cambios/'+u+'/'+key]=null;if(lk)up['cambios/'+u+'/'+lk]=null});
    const fa=fd(key),fb=lk?fd(lk):null;
    Object.entries(hist||{}).forEach(([k,x])=>{
      if(x&&x.cat==='comp'&&x.otroUid===other&&(k===hk||(fb&&((x.diaTrabaja===fa&&x.diaLibra===fb)||(x.diaTrabaja===fb&&x.diaLibra===fa))))){
        up['historial2/'+S.miID+'/'+k]=null;up['historial2/'+other+'/'+k]=null}});
    await db.ref().update(up);cerrarModal();
  }catch(e){alert('No se pudo borrar: '+(e.code||e.message||e))}
}
async function marcarDia(y,m,d,clase){
  const key=claveActual(cambios,y,m,d),prev=cambios[key];
  try{
    if(clase==='quitar'){
      if(prev&&prev.linkedUid){await borrarCambioComp(key,prev);return}
      if(prev&&prev.clase==='b-vac'){await borrarVacaciones(key);return}
      if(prev&&prev.histKey&&prev.texto==='Libre sin compensación'){
        if(hist[prev.histKey]&&hist[prev.histKey].usado){alert('Este día ya se ha usado. Gestiónalo desde la app de Android.');return}
        await db.ref('historial2/'+S.miID+'/'+prev.histKey).remove();await db.ref('cambios/'+S.miID+'/'+key).remove();cerrarModal();return;
      }
      if(prev&&prev.histKey){alert('Esta marca está enlazada con el Historial (cambio, pendiente, L-26…). Para quitarla, hazlo desde la app de Android.');return}
      await db.ref('cambios/'+S.miID+'/'+key).remove();
    }else{
      if(prev&&prev.histKey&&!confirm('Este día está enlazado con el Historial de la app de Android. ¿Seguro que quieres sustituir la marca?'))return;
      const txt={'b-vac':'Vacaciones','b-cambio-libre':'Libre sin compensación','b-inter':'Trabajado'}[clase];
      if(clase==='b-cambio-libre'){
        const hr=db.ref('historial2/'+S.miID).push();
        await hr.set({cat:'libreGracioso',fecha:d+'/'+(m+1)+'/'+y,ts:Date.now(),nota:'Libre sin compensación',usado:false,diaKey:key});
        await db.ref('cambios/'+S.miID+'/'+key).set({clase:clase,texto:txt,histKey:hr.key});
      }else await db.ref('cambios/'+S.miID+'/'+key).set({clase:clase,texto:txt});
    }
    cerrarModal();
  }catch(e){alert('No se pudo guardar: '+(e.code||e.message||e))}
}
